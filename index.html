<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090914">
<title>NEON COURIER — 2097</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#f4f3ff;--muted:#9a9ab8;--cyan:#49f6ff;--pink:#ff4fc8;--violet:#a88bff;--panel:rgba(14,14,31,.91)}*{box-sizing:border-box}.hidden{display:none!important}html,body{height:100%;margin:0;background:#080812;color:var(--ink);font-family:'Rajdhani',sans-serif;overflow:hidden}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,1280px,160dvh);height:min(62.5vw,800px,100dvh);aspect-ratio:16/10;overflow:hidden;background:#080812;box-shadow:0 0 80px #280d4a66;border:1px solid #392e5d}.game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 47%,#08081299 100%);z-index:1}.hud{position:absolute;inset:0;z-index:2;pointer-events:none;display:none}.topbar{position:absolute;top:15px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand-mini{font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 0 13px var(--cyan);font-size:20px}.brand-mini span{color:var(--cyan)}.mission-card,.stat-card{background:linear-gradient(135deg,#14132beF,#101020df);border:1px solid #4b3b76;border-radius:8px;padding:9px 13px;box-shadow:0 0 22px #24144f88}.mission-card{min-width:220px}.eyebrow{font:10px 'Space Mono',monospace;letter-spacing:1.6px;color:var(--cyan);text-transform:uppercase}.mission-title{font-size:17px;font-weight:700}.mission-sub{font:10px 'Space Mono',monospace;color:#aaa9c3}.stats{display:flex;gap:8px}.stat-card{text-align:center;min-width:85px}.stat-label{font:9px 'Space Mono',monospace;color:var(--muted);letter-spacing:1px}.stat-value{font-size:21px;font-weight:700;line-height:1.1}.stat-value.pink{color:var(--pink)}.stat-value.cyan{color:var(--cyan)}.right-controls{display:flex;gap:7px;pointer-events:auto}.icon-btn{width:37px;height:37px;border:1px solid #594d7d;background:#131329;color:#fff;border-radius:7px;font-size:17px;cursor:pointer}.icon-btn:hover{color:var(--cyan);border-color:var(--cyan)}.bottom-hud{position:absolute;left:18px;right:18px;bottom:15px;display:flex;align-items:flex-end;justify-content:space-between}.hint{padding:9px 12px;border:1px solid #49365f;border-radius:7px;background:#111020dd;font:10px 'Space Mono',monospace;color:#c5c3db}.hint b{color:var(--cyan)}.combo{color:#ffd86d;font-weight:bold}.minimap{width:142px;height:100px;border:1px solid #8261c9;border-radius:6px;background:#0d0e1bcc;box-shadow:0 0 18px #7722aa66}.toast{position:absolute;left:50%;top:23%;transform:translate(-50%,-10px);opacity:0;transition:.25s;background:#101324ee;border:1px solid var(--cyan);color:#eafcff;padding:10px 18px;border-radius:6px;font-weight:700;letter-spacing:1px;box-shadow:0 0 24px #28d5ff66}.toast.show{opacity:1;transform:translate(-50%,0)}.touch{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:170px;height:125px;pointer-events:auto;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px}.touch button{border:1px solid #54eafa99;border-radius:12px;background:#14142dbb;color:#e8fdff;font-size:22px;touch-action:none;box-shadow:0 0 15px #1be7ff33}.touch button:active{background:#20c5db88}.touch [data-dir=up]{grid-column:2}.touch [data-dir=left]{grid-column:1;grid-row:2}.touch [data-dir=down]{grid-column:2;grid-row:2}.touch [data-dir=right]{grid-column:3;grid-row:2}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#070711ed 0%,#080817d9 48%,#08081766 100%);padding:24px}.overlay.hidden{display:none}.panel{width:min(520px,94%);max-height:92%;overflow:auto;background:linear-gradient(145deg,#14142bee,#0c0c1dee);border:1px solid #624b91;border-radius:12px;padding:clamp(20px,4vw,36px);box-shadow:0 0 45px #7f30bb33, inset 0 0 35px #181433}.panel.wide{width:min(700px,96%)}.kicker{font:11px 'Space Mono',monospace;color:var(--cyan);letter-spacing:3px;text-transform:uppercase}.logo{font-size:clamp(46px,8vw,82px);font-weight:700;line-height:.82;letter-spacing:2px;margin:12px 0 18px;text-shadow:0 0 12px #fa40c8,0 0 30px #a428bd}.logo span{display:block;color:var(--cyan);text-shadow:0 0 13px #18d9f6,0 0 35px #1373bc}.tagline{font:11px 'Space Mono',monospace;color:#b9b7ce;line-height:1.8;margin-bottom:25px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:1px solid #655484;border-radius:5px;color:#eeeaff;background:#17172c;font:700 15px 'Rajdhani',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px #21e6ff3d;transform:translateY(-1px)}.btn.primary{grid-column:1/-1;background:linear-gradient(90deg,#9436a5,#394fc0);border-color:#e66add;color:white;font-size:20px;box-shadow:0 0 22px #a438c655}.btn.primary:hover{box-shadow:0 0 30px #40e9ff77}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.panel-title{font-size:36px;font-weight:700;letter-spacing:2px;margin:5px 0}.close-btn{border:0;background:none;color:#b8b2cf;font-size:25px;cursor:pointer}.coin-line{font:12px 'Space Mono',monospace;color:#ffd86d}.upgrade-list{display:grid;gap:10px}.upgrade{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:13px;border:1px solid #3c365c;background:#111124;border-radius:7px}.upgrade h3{margin:0;font-size:20px}.upgrade p{margin:1px 0 0;color:#a6a4bf;font:10px 'Space Mono',monospace}.level-pips{color:var(--cyan);letter-spacing:3px;font-size:12px}.buy{min-width:100px}.settings-row{padding:15px 0;border-bottom:1px solid #34304e;display:flex;justify-content:space-between;align-items:center;font-size:18px}.settings-row input{accent-color:#ed50cd;width:130px}.credits{font:12px 'Space Mono',monospace;line-height:2;color:#c5c1dc}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions .btn{flex:1}.result-big{font-size:58px;color:var(--cyan);font-weight:bold;text-shadow:0 0 24px #1cdaff88}.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.result-stats div{padding:12px;background:#101021;border:1px solid #383458;border-radius:6px;color:#a5a2bd;font:10px 'Space Mono',monospace}.result-stats b{display:block;color:white;font:700 21px 'Rajdhani',sans-serif}.progress{height:5px;background:#24213a;border-radius:4px;margin-top:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));box-shadow:0 0 9px var(--cyan)}
@media(max-width:700px){.shell{width:100vw;height:100dvh;aspect-ratio:auto;border:0}.topbar{top:8px;left:8px;right:8px;gap:5px}.brand-mini{font-size:14px;letter-spacing:1px}.mission-card{min-width:unset;padding:6px 8px}.mission-title{font-size:13px}.mission-sub{font-size:8px}.eyebrow{font-size:8px}.stats{gap:4px}.stat-card{min-width:54px;padding:6px 5px}.stat-label{font-size:7px}.stat-value{font-size:16px}.right-controls{gap:4px}.icon-btn{width:31px;height:31px;font-size:14px}.bottom-hud{left:8px;right:8px;bottom:8px}.minimap{width:100px;height:72px}.hint{font-size:8px;padding:6px}.touch{display:grid;bottom:88px;left:24px;transform:none;width:130px;height:98px}.overlay{padding:12px}.panel{padding:22px 18px}.logo{font-size:54px}.tagline{font-size:9px;margin-bottom:15px}.btn{min-height:40px}.mission-card{max-width:145px}}
@media(max-height:500px) and (orientation:landscape){.touch{bottom:8px;left:8px;width:120px;height:90px}.bottom-hud{bottom:7px}.overlay{padding:10px}.panel{padding:15px 20px}.logo{font-size:47px;margin:7px 0 10px}.tagline{margin-bottom:12px}.menu-grid{gap:6px}}
</style>
</head>
<body>
<main class="shell" id="shell"><canvas class="game" id="game"></canvas><div class="vignette"></div>
<div class="hud" id="hud"><div class="topbar"><div><div class="brand-mini">NEON <span>COURIER</span></div><div class="mission-card"><div class="eyebrow" id="missionState">AKTİF TESLİMAT</div><div class="mission-title" id="missionTitle">Paket alınıyor</div><div class="mission-sub" id="missionSub">Hedefe ulaş</div></div></div><div class="stats"><div class="stat-card"><div class="stat-label">SÜRE</div><div class="stat-value pink" id="timer">01:30</div></div><div class="stat-card"><div class="stat-label">TESLİMAT</div><div class="stat-value cyan" id="deliveries">0 / 3</div></div><div class="stat-card"><div class="stat-label">JETON</div><div class="stat-value" id="coinsHud">0</div></div></div><div class="right-controls"><button class="icon-btn" id="pauseBtn" aria-label="Duraklat">Ⅱ</button></div></div>
<div class="bottom-hud"><div class="hint"><b>WASD / ↑↓←→</b> sürüş &nbsp;·&nbsp; <span class="combo" id="comboHud">SERİ ×1</span></div><canvas class="minimap" id="minimap" width="284" height="200"></canvas></div><div class="toast" id="toast"></div></div>
<div class="touch hidden" id="touch"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<div class="overlay" id="overlay"><section class="panel" id="mainPanel"><div class="kicker">GECE VARDİYASI • 2097</div><h1 class="logo">NEON<span>COURIER</span></h1><div class="tagline">YAĞMUR HİÇ DİNMİYOR. TESLİMAT DA BEKLEMİYOR.<br>Neo İstanbul'un gece rotası seni çağırıyor.</div><div class="menu-grid"><button class="btn primary" id="playBtn">▶ &nbsp; VARDİYAYA BAŞLA</button><button class="btn" id="garageBtn">◈ GARAJ</button><button class="btn" id="settingsBtn">⚙ AYARLAR</button><button class="btn" id="creditsBtn" style="grid-column:1/-1">✦ JENERİK</button></div><div class="tagline" style="margin:20px 0 0;font-size:9px">KAYITLI BAKİYE <span id="menuCoins" style="color:#ffd86d">0 ◈</span> &nbsp; / &nbsp; <span id="menuLevel">BÖLÜM 01</span></div></section><section class="panel wide hidden" id="subPanel"></section></div>
</main>
<script>
/* NEON COURIER — compact canvas arcade game */
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),mm=document.getElementById('minimap'),mctx=mm.getContext('2d');
let W=960,H=600;const ROAD=176,CELL=380,ROADW=108;
let state='menu',last=0,raf=0,elapsed=0,toastTimer=0,ac=null,musicNodes=[],musicOn=true,sfxOn=true,masterVol=.35;
let save={coins:0,level:1,upgrades:{speed:0,handling:0,bonus:0},best:0};
try{save={...save,...JSON.parse(localStorage.getItem('neonCourierSave')||'{}')};save.upgrades={speed:0,handling:0,bonus:0,...save.upgrades}}catch{}
const levels=[{name:'İlk Gece',deliveries:3,time:100,grid:3,reward:45},{name:'Yağmur Hattı',deliveries:4,time:115,grid:4,reward:65},{name:'Neon Labirent',deliveries:5,time:135,grid:4,reward:90},{name:'Yüksek Voltaj',deliveries:6,time:155,grid:5,reward:125},{name:'Şehrin Nabzı',deliveries:7,time:180,grid:5,reward:170}];
let world={w:0,h:0,cols:0,rows:0,buildings:[],cars:[],barriers:[],rain:[],signs:[]},bike={x:0,y:0,vx:0,vy:0,angle:0},mission={list:[],index:0,phase:'pickup'},timer=0,delivered=0,combo=0,coinsThis=0,runDistance=0,keys={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function persist(){localStorage.setItem('neonCourierSave',JSON.stringify(save));uiCoins()}
function uiCoins(){document.getElementById('menuCoins').textContent=save.coins+' ◈';document.getElementById('menuLevel').textContent='BÖLÜM '+String(Math.min(save.level,5)).padStart(2,'0')}
function fit(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
new ResizeObserver(fit).observe(document.getElementById('shell'));fit();uiCoins();
function initAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();}if(ac.state==='suspended')ac.resume()}
function tone(freq,duration=0.12,type='sine',vol=.12){if(!sfxOn)return;initAudio();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol*masterVol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}
function musicStart(){if(!musicOn||musicNodes.length)return;initAudio();const gain=ac.createGain();gain.gain.value=.035*masterVol;gain.connect(ac.destination);[55,82.4,110].forEach((f,i)=>{const o=ac.createOscillator();o.type=i?'triangle':'sawtooth';o.frequency.value=f;o.connect(gain);o.start();musicNodes.push(o)});musicNodes.push(gain)}
function musicStop(){musicNodes.forEach(n=>{try{n.stop?.();n.disconnect()}catch{}});musicNodes=[]}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
function startLevel(){initAudio();musicStart();const lv=levels[Math.min(save.level,5)-1];world.w=lv.grid*CELL+ROAD;world.h=lv.grid*CELL+ROAD;timer=lv.time;delivered=0;combo=0;coinsThis=0;runDistance=0;mission={list:[],index:0,phase:'pickup'};bike={x:ROAD/2,y:ROAD/2,vx:0,vy:0,angle:0};generateCity(lv);makeMissions(lv.deliveries);state='playing';document.getElementById('hud').style.display='block';document.getElementById('touch').classList.remove('hidden');hideOverlay();updateHud();last=performance.now()}
function generateCity(lv){world.buildings=[];world.cars=[];world.barriers=[];world.rain=[];world.signs=[];const n=lv.grid;world.cols=n;world.rows=n;for(let gy=0;gy<n;gy++)for(let gx=0;gx<n;gx++){const bx=ROAD+gx*CELL+ROADW/2,by=ROAD+gy*CELL+ROADW/2;const bw=CELL-ROADW-20,bh=CELL-ROADW-20;world.buildings.push({x:bx,y:by,w:bw,h:bh,hue:pick([188,278,320,205]),seed:Math.random()})}
for(let i=0;i<Math.max(8,lv.grid*5);i++){const horizontal=Math.random()<.5;const li=Math.floor(rand(0,lv.grid+1));const lane=(li===0?52:li===lv.grid?world.w-100:420+(li-1)*CELL)+(Math.random()<.5?-19:19);world.cars.push({x:horizontal?rand(0,world.w):lane,y:horizontal?lane:rand(0,world.h),horizontal,dir:Math.random()<.5?-1:1,speed:rand(60,112)+save.level*8,color:pick(['#ff4fc8','#43e9ff','#ffc857','#836bff']),w:horizontal?28:16,h:horizontal?15:27})}
for(let i=0;i<Math.max(5,lv.grid*3);i++){const horizontal=Math.random()<.5;const li=Math.floor(rand(0,lv.grid+1));const lane=(li===0?52:li===lv.grid?world.w-100:420+(li-1)*CELL)+(Math.random()<.5?-46:46);world.barriers.push({x:horizontal?rand(80,world.w-80):lane,y:horizontal?lane:rand(80,world.h-80),horizontal,w:horizontal?25:13,h:horizontal?12:25})}
for(let i=0;i<75;i++)world.rain.push({x:rand(0,W),y:rand(0,H),l:rand(5,13),s:rand(280,600)});for(let i=0;i<30;i++)world.signs.push({x:rand(80,world.w-80),y:rand(80,world.h-80),color:pick(['#38edff','#fd4ecb','#a586ff'])})}
function roadPoint(){const n=levels[Math.min(save.level,5)-1].grid;const lane=Math.floor(rand(0,n+1));const offset=lane===0?52:lane===n?world.w-100:420+(lane-1)*CELL;return Math.random()<.5?{x:rand(ROAD/2,world.w-ROAD/2),y:clamp(offset,30,world.h-30)}:{x:clamp(offset,30,world.w-30),y:rand(ROAD/2,world.h-ROAD/2)}}
function makeMissions(n){for(let i=0;i<n;i++){let p=roadPoint(),d=roadPoint(),tries=0;while(Math.hypot(p.x-d.x,p.y-d.y)<350&&tries++<20)d=roadPoint();mission.list.push({pickup:p,dest:d})}}
function hideOverlay(){document.getElementById('overlay').classList.add('hidden')}
function showMain(){state='menu';world.w=0;world.h=0;document.getElementById('hud').style.display='none';document.getElementById('touch').classList.add('hidden');document.getElementById('overlay').classList.remove('hidden');document.getElementById('mainPanel').classList.remove('hidden');document.getElementById('subPanel').classList.add('hidden');uiCoins()}
function openPanel(title,kicker,html){const p=document.getElementById('subPanel');document.getElementById('mainPanel').classList.add('hidden');p.classList.remove('hidden');p.innerHTML=`<div class="panel-head"><div><div class="kicker">${kicker}</div><h2 class="panel-title">${title}</h2></div><button class="close-btn" data-close>×</button></div>${html}`;p.querySelector('[data-close]').onclick=()=>{p.classList.add('hidden');document.getElementById('mainPanel').classList.remove('hidden');tone(330)}}
function openGarage(){const names={speed:'MOTOR GÜCÜ',handling:'HASSAS DİREKSİYON',bonus:'KURYENİN PAYI'},desc={speed:'Azami hız +%12',handling:'Daha çevik dönüş +%14',bonus:'Teslimat ödülü +%20'};let html=`<div class="coin-line">CÜZDAN: ${save.coins} ◈</div><div class="upgrade-list" style="margin-top:13px">`;for(const k of Object.keys(names)){let lvl=save.upgrades[k],cost=50+lvl*65;html+=`<article class="upgrade"><div><h3>${names[k]}</h3><p>${desc[k]} • ${lvl}/5 SEVİYE</p><div class="level-pips">${'◆'.repeat(lvl)}${'◇'.repeat(5-lvl)}</div></div><button class="btn buy" data-buy="${k}" ${lvl>=5?'disabled':''}>${lvl>=5?'MAKS':cost+' ◈'}</button></article>`}html+='</div><p class="tagline" style="margin:14px 0 0">Her yükseltme kalıcıdır. Şehirde kazan, motorunu geliştir.</p>';openPanel('MOTOR GARAJI','SOKAKLARA HAZIRLA',html);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy,l=save.upgrades[k],cost=50+l*65;if(l>=5)return;if(save.coins<cost){tone(110,.2,'sawtooth');showToast('YETERSİZ JETON');return}save.coins-=cost;save.upgrades[k]++;persist();tone(660,.16);openGarage()})}
function openSettings(){openPanel('AYARLAR','SÜRÜŞÜNÜ AYARLA',`<div class="settings-row"><span>◖ MÜZİK</span><input id="musicToggle" type="checkbox" ${musicOn?'checked':''}></div><div class="settings-row"><span>♫ EFEKTLER</span><input id="sfxToggle" type="checkbox" ${sfxOn?'checked':''}></div><div class="settings-row"><span>SES SEVİYESİ</span><input id="volume" type="range" min="0" max="100" value="${Math.round(masterVol*100)}"></div><p class="tagline" style="margin:15px 0 0">WASD veya yön tuşlarıyla sür. Telefonda ekrandaki yön tuşlarını kullan.</p>`);document.getElementById('musicToggle').onchange=e=>{musicOn=e.target.checked;if(musicOn)musicStart();else musicStop()};document.getElementById('sfxToggle').onchange=e=>sfxOn=e.target.checked;document.getElementById('volume').oninput=e=>{masterVol=e.target.value/100;if(musicNodes.length)musicNodes[musicNodes.length-1].gain.value=.035*masterVol}}
function openCredits(){openPanel('JENERİK','GECE VARDİYASI • 2097',`<div class="credits">NEON COURIER<br><span style="color:#49f6ff">Neo İstanbul'da bir gece mesaisi.</span><br><br>TASARIM & GELİŞTİRME<br>Bağımsız bir sokak efsanesi<br><br>Bu şehir uyumaz.<br>Motorunu çalıştır. Paketleri yetiştir.<br><br><span style="color:#ff4fc8">YAĞMURUN ALTINDA, IŞIKLARIN İÇİNDE.</span></div>`)}
function pause(){if(state==='playing'){state='paused';document.getElementById('overlay').classList.remove('hidden');openPanel('MOLA','MOTORU DİNLENDİR',`<div class="tagline">Vardiya duraklatıldı. Şehir seni bekliyor.</div><div class="modal-actions"><button class="btn primary" id="resume">▶ DEVAM ET</button><button class="btn" id="quit">ANA MENÜ</button></div>`);document.getElementById('resume').onclick=()=>{hideOverlay();state='playing';last=performance.now();tone(520)};document.getElementById('quit').onclick=showMain}}
function finishLevel(){state='complete';const lv=levels[Math.min(save.level,5)-1],bonus=Math.floor(timer/10)+combo*5,earned=lv.reward+bonus+(delivered*10*(save.upgrades.bonus+1));save.coins+=earned;save.best=Math.max(save.best,delivered);if(save.level<6)save.level++;persist();musicStop();tone(880,.3);openResult(true,earned,bonus)}
function gameOver(){if(state!=='playing')return;state='over';musicStop();tone(130,.6,'sawtooth');openResult(false,0,0)}
function openResult(won,earned,bonus){document.getElementById('hud').style.display='none';document.getElementById('touch').classList.add('hidden');document.getElementById('overlay').classList.remove('hidden');const p=document.getElementById('subPanel');document.getElementById('mainPanel').classList.add('hidden');p.classList.remove('hidden');let lv=levels[Math.min(save.level-(won?1:0),5)-1];p.innerHTML=`<div class="kicker">${won?'ROTA TAMAMLANDI':'VARDİYA SONA ERDİ'} • BÖLÜM ${String(Math.min(save.level-(won?1:0),5)).padStart(2,'0')}</div><h2 class="panel-title">${won?'TESLİMAT BAŞARILI':'SÜRE DOLDU'}</h2><div class="result-big">${won?'+'+earned:'↻' } ${won?'◈':''}</div><div class="result-stats"><div>TESLİMAT<b>${delivered} / ${lv.deliveries}</b></div><div>EN YÜKSEK SERİ<b>×${Math.max(1,combo)}</b></div><div>ROTA ÖDÜLÜ<b>${won?lv.reward:0} ◈</b></div><div>HIZ BONUSU<b>${won?bonus:0} ◈</b></div></div><div class="progress"><i style="width:${won?100:Math.round(delivered/lv.deliveries*100)}%"></i></div><div class="modal-actions"><button class="btn primary" id="resultNext">${won?(save.level>5?'ANA MENÜ':'SONRAKİ ROTA'):'TEKRAR DENE'}</button><button class="btn" id="resultMenu">GARAJA DÖN</button></div>`;document.getElementById('resultNext').onclick=()=>{if(won&&save.level>5){showMain()}else startLevel()};document.getElementById('resultMenu').onclick=showMain}
function bump(){tone(100,.22,'square',.08);bike.vx*=-.32;bike.vy*=-.32;bike.x=clamp(bike.x,14,world.w-14);bike.y=clamp(bike.y,14,world.h-14)}
function collides(x,y){for(const b of world.buildings)if(x+9>b.x-b.w/2&&x-9<b.x+b.w/2&&y+9>b.y-b.h/2&&y-9<b.y+b.h/2)return true;for(const b of world.barriers)if(Math.abs(x-b.x)<b.w/2+8&&Math.abs(y-b.y)<b.h/2+8)return true;for(const c of world.cars)if(Math.abs(x-c.x)<c.w/2+9&&Math.abs(y-c.y)<c.h/2+9)return true;return x<12||y<12||x>world.w-12||y>world.h-12}
function target(){return mission.list[mission.index]}
function completeDelivery(){delivered++;combo++;let amount=Math.floor(10*(1+save.upgrades.bonus*.2)*Math.min(3,1+combo*.15));coinsThis+=amount;save.coins+=amount;persist();tone(770,.1);setTimeout(()=>tone(1100,.22),80);showToast(`TESLİMAT TAMAM!  +${amount} ◈  SERİ ×${combo}`);mission.index++;mission.phase='pickup';if(delivered>=levels[Math.min(save.level,5)-1].deliveries){setTimeout(()=>{if(state==='playing')finishLevel()},350)}}
function update(dt){if(state!=='playing')return;timer-=dt;if(timer<=0){timer=0;updateHud();gameOver();return}const speed=145+save.upgrades.speed*17,turn=1+save.upgrades.handling*.13;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx&&dy){dx*=.707;dy*=.707}const accel=520*turn;bike.vx+=dx*accel*dt;bike.vy+=dy*accel*dt;const drag=Math.pow(dx||dy?.88:.82,dt*60);bike.vx*=drag;bike.vy*=drag;const vmax=speed;const mag=Math.hypot(bike.vx,bike.vy);if(mag>vmax){bike.vx=bike.vx/mag*vmax;bike.vy=bike.vy/mag*vmax}let nx=bike.x+bike.vx*dt,ny=bike.y+bike.vy*dt;if(collides(nx,ny))bump();else{bike.x=nx;bike.y=ny}if(mag>8){bike.angle=Math.atan2(bike.vy,bike.vx);runDistance+=mag*dt}
for(const c of world.cars){if(c.horizontal)c.x+=c.dir*c.speed*dt;else c.y+=c.dir*c.speed*dt;if(c.x<-60)c.x=world.w+60;if(c.x>world.w+60)c.x=-60;if(c.y<-60)c.y=world.h+60;if(c.y>world.h+60)c.y=-60}
const t=target();if(t){let p=mission.phase==='pickup'?t.pickup:t.dest;if(Math.hypot(bike.x-p.x,bike.y-p.y)<31){if(mission.phase==='pickup'){mission.phase='deliver';tone(440,.13);showToast('PAKET ALINDI — TESLİMAT NOKTASINA GİT!')}else completeDelivery()}}
world.rain.forEach(r=>{r.y+=r.s*dt;r.x-=r.s*.12*dt;if(r.y>H+20){r.y=-20;r.x=rand(0,W)}});updateHud()}
function updateHud(){const secs=Math.ceil(timer);document.getElementById('timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('deliveries').textContent=`${delivered} / ${levels[Math.min(save.level,5)-1].deliveries}`;document.getElementById('coinsHud').textContent=save.coins;document.getElementById('comboHud').textContent=`SERİ ×${Math.max(1,combo)}`;const t=target();if(t){document.getElementById('missionState').textContent=mission.phase==='pickup'?'PAKETİ AL':'PAKETİ TESLİM ET';document.getElementById('missionTitle').textContent=mission.phase==='pickup'?'Paket noktası':'Müşteri bekliyor';document.getElementById('missionSub').textContent=mission.phase==='pickup'?'Pembe işarete git':'Mavi işarete git'}}
function camera(){return{x:clamp(bike.x-W/2,0,Math.max(0,world.w-W)),y:clamp(bike.y-H/2,0,Math.max(0,world.h-H))}}
function drawWorld(){const cam=camera();ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#111321';ctx.fillRect(cam.x,cam.y,W,H);
// Asphalt grid and luminous lane markings
ctx.fillStyle='#171a27';ctx.fillRect(0,0,world.w,world.h);
const n=levels[Math.min(save.level,5)-1].grid;for(let i=0;i<=n;i++){let xs,xe;if(i===0){xs=0;xe=104}else if(i===n){xs=ROAD+(n-1)*CELL+180;xe=world.w}else{xs=ROAD+(i-1)*CELL+180;xe=ROAD+i*CELL-72}ctx.fillStyle='#1b1c2a';ctx.fillRect(xs,0,xe-xs,world.h);ctx.fillRect(0,xs,world.w,xe-xs);ctx.strokeStyle='#4b4a63';ctx.lineWidth=2;ctx.setLineDash([18,21]);ctx.beginPath();ctx.moveTo((xs+xe)/2,0);ctx.lineTo((xs+xe)/2,world.h);ctx.moveTo(0,(xs+xe)/2);ctx.lineTo(world.w,(xs+xe)/2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#32d8ef22';ctx.lineWidth=4;ctx.strokeRect(xs+3,0,xe-xs-6,world.h);ctx.strokeRect(0,xs+3,world.w,xe-xs-6)}
// buildings, rooftop details, windows
for(const b of world.buildings){if(b.x+b.w/2<cam.x-20||b.x-b.w/2>cam.x+W+20||b.y+b.h/2<cam.y-20||b.y-b.h/2>cam.y+H+20)continue;ctx.fillStyle='#0b0c18';ctx.fillRect(b.x-b.w/2-9,b.y-b.h/2-9,b.w+18,b.h+18);ctx.fillStyle='#18182a';ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.strokeStyle=`hsla(${b.hue},90%,65%,.8)`;ctx.lineWidth=2;ctx.strokeRect(b.x-b.w/2+5,b.y-b.h/2+5,b.w-10,b.h-10);ctx.fillStyle='#22233b';ctx.fillRect(b.x-b.w/2+13,b.y-b.h/2+13,b.w-26,b.h-26);for(let wx=b.x-b.w/2+22;wx<b.x+b.w/2-15;wx+=31){for(let wy=b.y-b.h/2+22;wy<b.y+b.h/2-15;wy+=29){let lit=Math.sin(wx*1.7+wy*3.1+b.seed*30)>.05;ctx.fillStyle=lit?`hsla(${b.hue},90%,65%,.58)`:'#0c1020';ctx.fillRect(wx,wy,8,7)}}ctx.fillStyle=`hsla(${b.hue},100%,65%,.1)`;ctx.fillRect(b.x-b.w/2+12,b.y-b.h/2+11,b.w-24,3);ctx.fillStyle='#25243b';ctx.fillRect(b.x-22,b.y-8,44,16);ctx.fillStyle=`hsla(${b.hue},95%,70%,.9)`;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(pick(['N-7','夜','24H','2097','NEO']),b.x,b.y+3)}
// glowing street lamps and reflections
for(let i=0;i<world.signs.length;i++){const s=world.signs[i];if(s.x<cam.x-50||s.x>cam.x+W+50||s.y<cam.y-50||s.y>cam.y+H+50)continue;ctx.globalAlpha=.16;ctx.fillStyle=s.color;ctx.beginPath();ctx.ellipse(s.x,s.y,30,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=s.color;ctx.fillRect(s.x-2,s.y-2,4,4)}
for(const c of world.cars){ctx.save();ctx.translate(c.x,c.y);if(!c.horizontal)ctx.rotate(Math.PI/2);ctx.shadowBlur=14;ctx.shadowColor=c.color;ctx.fillStyle='#10121e';ctx.fillRect(-c.w/2-2,-c.h/2-2,c.w+4,c.h+4);ctx.fillStyle=c.color;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.fillStyle='#b9faff';ctx.fillRect(c.w/2-5,-c.h/2+2,3,3);ctx.fillRect(c.w/2-5,c.h/2-5,3,3);ctx.fillStyle='#252b3b';ctx.fillRect(-c.w/2+4,-c.h/2+2,c.w/2, c.h-4);ctx.restore()}
for(const b of world.barriers){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#141625';ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.fillStyle='#ffcb54';if(b.horizontal){for(let x=-b.w/2;x<b.w/2;x+=9)ctx.fillRect(x,-b.h/2,4,b.h)}else for(let y=-b.h/2;y<b.h/2;y+=9)ctx.fillRect(-b.w/2,y,b.w,4);ctx.restore()}
const t=target();if(t){let p=mission.phase==='pickup'?t.pickup:t.dest;let pulse=1+Math.sin(elapsed*5)*.15;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.22;ctx.fillStyle=mission.phase==='pickup'?'#ff4fc8':'#49f6ff';ctx.beginPath();ctx.arc(0,0,31*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=mission.phase==='pickup'?'#ff61d1':'#4cf7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,18*pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-5,-5,10,10);ctx.fillStyle=mission.phase==='pickup'?'#ff4fc8':'#49f6ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(mission.phase==='pickup'?'AL':'TESLİM',0,-27);ctx.restore()}
// motorcycle shadow, glowing body and rider
ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(bike.angle+Math.PI/2);ctx.fillStyle='#05060b99';ctx.beginPath();ctx.ellipse(4,5,9,17,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=18;ctx.shadowColor='#45f7ff';ctx.fillStyle='#44eaff';ctx.fillRect(-4,-12,8,24);ctx.fillStyle='#ff4fc8';ctx.fillRect(-7,-3,14,8);ctx.fillStyle='#111324';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9ffff';ctx.fillRect(-2,-14,4,4);ctx.fillStyle='#ff385e';ctx.fillRect(-2,10,4,4);ctx.restore();ctx.restore()}
function drawRain(){ctx.save();ctx.strokeStyle='#83e5ff55';ctx.lineWidth=1;for(const r of world.rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.l);ctx.stroke()}ctx.restore()}
function drawMap(){if(!world.w)return;const w=mm.width,h=mm.height,sx=w/world.w,sy=h/world.h;mctx.fillStyle='#0a0b16';mctx.fillRect(0,0,w,h);mctx.fillStyle='#252638';for(let i=0;i<world.buildings.length;i++){const b=world.buildings[i];mctx.fillRect((b.x-b.w/2)*sx,(b.y-b.h/2)*sy,b.w*sx,b.h*sy)}const t=target();if(t){const p=mission.phase==='pickup'?t.pickup:t.dest;mctx.fillStyle=mission.phase==='pickup'?'#ff4fc8':'#49f6ff';mctx.beginPath();mctx.arc(p.x*sx,p.y*sy,5,0,Math.PI*2);mctx.fill()}mctx.fillStyle='#fff';mctx.shadowColor='#49f6ff';mctx.shadowBlur=9;mctx.beginPath();mctx.arc(bike.x*sx,bike.y*sy,4,0,Math.PI*2);mctx.fill();mctx.shadowBlur=0;const c=camera();mctx.strokeStyle='#bcb8ff99';mctx.strokeRect(c.x*sx,c.y*sy,W*sx,H*sy)}
function frame(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;elapsed+=dt;if(state==='playing')update(dt);ctx.clearRect(0,0,W,H);if(world.w)drawWorld();else{ctx.fillStyle='#080916';ctx.fillRect(0,0,W,H);drawMenuScene()}drawRain();if(state==='playing')drawMap();raf=requestAnimationFrame(frame)}
function drawMenuScene(){const t=performance.now()/1000,u=Math.max(.65,Math.min(W/960,H/600));ctx.fillStyle='#101322';ctx.fillRect(0,0,W,H);for(let i=0;i<16;i++){const x=((i*103*u-t*13*u)%(W+160*u)+W+160*u)%(W+160*u)-80*u,y=35*u+(i*79*u)%Math.max(1,H-70*u);ctx.fillStyle=i%2?'#19182c':'#202038';ctx.fillRect(x,y,58*u,50*u);ctx.strokeStyle=i%3?'#7335a5':'#19aab8';ctx.strokeRect(x+4*u,y+4*u,50*u,42*u);ctx.fillStyle=i%2?'#ff4fc8':'#42eaf7';ctx.globalAlpha=.5+Math.sin(t*2+i)*.3;ctx.fillRect(x+15*u,y+12*u,5*u,4*u);ctx.fillRect(x+34*u,y+25*u,7*u,5*u);ctx.globalAlpha=1}ctx.save();ctx.translate(W*.76,H*.67);ctx.scale(u,u);ctx.rotate(Math.sin(t)*.12);ctx.shadowBlur=26;ctx.shadowColor='#40f6ff';ctx.fillStyle='#43eafa';ctx.fillRect(-13,-72,26,144);ctx.fillStyle='#ff4fc8';ctx.fillRect(-25,-8,50,31);ctx.fillStyle='#111326';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#89eaff44';for(let i=0;i<42;i++){let x=(i*67*u+t*90*u)%W,y=(i*47*u+t*200*u)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3*u,y+10*u);ctx.stroke()}}
document.getElementById('playBtn').onclick=()=>{tone(520);startLevel()};document.getElementById('garageBtn').onclick=()=>{tone(360);openGarage()};document.getElementById('settingsBtn').onclick=()=>{tone(360);openSettings()};document.getElementById('creditsBtn').onclick=()=>{tone(360);openCredits()};document.getElementById('pauseBtn').onclick=pause;
const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};window.addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='Escape'||e.code==='KeyP'){if(state==='playing')pause();else if(state==='paused'){hideOverlay();state='playing';last=performance.now()}}});window.addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});document.querySelectorAll('.touch button').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true;b.setPointerCapture(e.pointerId)});const release=e=>{e.preventDefault();keys[dir]=false};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>keys[dir]=false)});
requestAnimationFrame(frame);
})();
</script>
